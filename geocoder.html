<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Geocoder – Noc Muzeów 2026</title>
<style>
  body{font-family:monospace;background:#0b0b18;color:#e6e0d0;padding:20px;margin:0;}
  h1{color:#f0c040;font-size:1.2rem;margin-bottom:8px;}
  p{color:#7a7490;font-size:.85rem;margin-bottom:20px;}
  #log{background:#1a1a2e;border:1px solid #252340;border-radius:8px;padding:16px;height:200px;overflow-y:auto;font-size:.75rem;color:#7a7490;margin-bottom:16px;}
  #log .ok{color:#3cc878;}
  #log .err{color:#e05a6e;}
  #progress{background:#252340;border-radius:4px;height:6px;margin-bottom:16px;}
  #bar{height:100%;background:#f0c040;border-radius:4px;width:0;transition:width .3s;}
  #output{background:#1a1a2e;border:1px solid #252340;border-radius:8px;padding:16px;font-size:.72rem;color:#3cc878;white-space:pre;overflow:auto;max-height:300px;display:none;}
  button{background:#f0c040;color:#0b0b18;border:none;padding:10px 24px;border-radius:8px;font-size:.9rem;font-weight:700;cursor:pointer;margin-right:10px;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  #copyBtn{background:#3cc878;display:none;}
  #status{color:#f0c040;font-size:.85rem;margin-bottom:12px;}
</style>
</head>
<body>
<h1>🗺 Geocoder – Noc Muzeów 2026 Wrocław</h1>
<p>Geocoduje 112 adresów przez <strong>Nominatim</strong> — 10 sekund przerwy między requestami (~20 minut łącznie).<br>
   Po zakończeniu skopiuj wygenerowany kod i wklej do <strong>noc-muzeow-2026.html</strong>.</p>

<div id="status">Gotowy do uruchomienia</div>
<div id="progress"><div id="bar"></div></div>
<div id="log"></div>
<button id="startBtn" onclick="start(0)">▶ Uruchom geocoding</button>
<button id="resumeBtn" style="display:none;background:#e8963a">⟳ Wznów</button>
<button id="copyBtn" onclick="copyOutput()">📋 Kopiuj kod</button>
<div id="output"></div>

<script>
const ADDRESSES = [
 {id:26,  p:"Jatki 19, Wrocław"},
 {id:31,  p:"Jatki 12-13, Wrocław"},
 {id:33,  p:"Ruska 46, Wrocław"},
 {id:34,  p:"Łokietka 9, Wrocław"},
 {id:35,  p:"Księcia Witolda 2, Wrocław"},
 {id:41,  p:"Ruska 46a, Wrocław"},
 {id:42,  p:"Księcia Witolda 68/2, Wrocław"},
 {id:44,  p:"Rynek 27/28, Wrocław"},
 {id:45,  p:"Krupnicza 13, Wrocław"},
 {id:46,  p:"Ruska 46a, Wrocław"},
 {id:50,  p:"Tęczowa 1, Wrocław"},
 {id:51,  p:"Św. Mikołaja 54/55, Wrocław"},
 {id:52,  p:"Ruska 46C, Wrocław"},
 {id:54,  p:"Ruska 46C, Wrocław"},
 {id:56,  p:"Świdnicka 38A, Wrocław"},
 {id:57,  p:"Wincentego 21, Wrocław"},
 {id:58,  p:"Jatki 11, Wrocław"},
 {id:70,  p:"Powstańców Śląskich 209, Wrocław"},
 {id:74,  p:"Serbska 5a, Wrocław"},
 {id:78,  p:"Łukasiewicza, Wrocław"},
 {id:80,  p:"Jagiełły 3/5, Wrocław"},
 {id:81,  p:"Rynek 14, Wrocław"},
 {id:93,  p:"Kołłątaja 20, Wrocław"},
 {id:96,  p:"Wybrzeże Wyspiańskiego 27, Wrocław"},
 {id:107,  p:"Piotra Skargi 23, Katy Wroclawskie"},
];

const results = {};
let running = false;

function log(msg, type=''){
  const el=document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function geocodeWithRetry(addr, retries=3){
  for(let attempt=1; attempt<=retries; attempt++){
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(addr)}&format=json&limit=1&countrycodes=pl`;
      const res = await fetch(url, {headers:{'User-Agent':'NocMuzeow2026-OneTimeGeocoder/1.0'}});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if(data && data[0]) return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
      return null;
    } catch(e){
      if(attempt < retries){
        log(`  ↻ próba ${attempt} nieudana (${e.message}), czekam 15s...`, 'err');
        await sleep(15000);
      } else {
        throw e;
      }
    }
  }
}

async function start(resumeFrom=0){
  if(running) return;
  running = true;
  document.getElementById('startBtn').disabled = true;
  document.getElementById('resumeBtn').style.display = 'none';
  if(resumeFrom===0){
    document.getElementById('log').innerHTML = '';
    log('Startuje geocoding 112 adresów przez Nominatim...');
    log('Przerwa 10 sek między requestami (~20 minut łącznie)');
    log('');
  } else {
    log(`Wznawianie od id:${ADDRESSES[resumeFrom].id}...`);
  }

  let failedAt = -1;

  for(let i=resumeFrom; i<ADDRESSES.length; i++){
    const a = ADDRESSES[i];
    document.getElementById('bar').style.width = ((i+1)/ADDRESSES.length*100)+'%';
    document.getElementById('status').textContent = `${i+1}/${ADDRESSES.length} · ${a.p}`;
    try {
      const r = await geocodeWithRetry(a.p);
      if(r){
        results[a.id] = r;
        log(`✓ id:${a.id} ${a.p} → ${r.lat.toFixed(5)}, ${r.lng.toFixed(5)}`, 'ok');
      } else {
        log(`⚠ id:${a.id} ${a.p} → nie znaleziono`, 'err');
      }
    } catch(e){
      log(`✗ BŁĄD przy id:${a.id} – ${e.message}. Kliknij Wznów.`, 'err');
      failedAt = i;
      break;
    }
    if(i < ADDRESSES.length-1) await sleep(10000);
  }

  running = false;
  document.getElementById('startBtn').disabled = false;

  if(failedAt >= 0){
    document.getElementById('status').textContent = `⚠ Zatrzymano przy ${failedAt+1}/112. Poczekaj chwilę i kliknij Wznów.`;
    const btn = document.getElementById('resumeBtn');
    btn.style.display = 'inline-block';
    btn.onclick = ()=>start(failedAt);
  } else {
    document.getElementById('status').textContent = '✅ Gotowe! Skopiuj kod poniżej.';
    showOutput();
  }
}

function showOutput(){
  const lines = ADDRESSES.map(a => {
    if(results[a.id]){
      return `  ${a.id}: {lat:${results[a.id].lat.toFixed(6)},lng:${results[a.id].lng.toFixed(6)}}`;
    }
    return `  ${a.id}: null // nie znaleziono`;
  });

  const code = `// Wklej to do noc-muzeow-2026.html jako stałą GEO_CORRECTIONS
// a potem użyj: EV.forEach(ev=>{ if(GEO_CORRECTIONS[ev.id]){ ev.lat=GEO_CORRECTIONS[ev.id].lat; ev.lng=GEO_CORRECTIONS[ev.id].lng; }});
const GEO_CORRECTIONS = {\n${lines.join(',\n')}\n};`;

  const out = document.getElementById('output');
  out.textContent = code;
  out.style.display = 'block';
  document.getElementById('copyBtn').style.display = 'inline-block';
}

function copyOutput(){
  const text = document.getElementById('output').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    document.getElementById('copyBtn').textContent = '✅ Skopiowano!';
    setTimeout(()=>{ document.getElementById('copyBtn').textContent = '📋 Kopiuj kod'; },2000);
  });
}
</script>
</body>
</html>
