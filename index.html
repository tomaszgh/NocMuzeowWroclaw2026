<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noc Muzeów 2026 – Wrocław</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night:#0b0b18; --panel:#12121e; --card:#1a1a2e;
  --gold:#f0c040; --rose:#e05a6e; --teal:#3accc8; --violet:#a78bfa;
  --text:#e6e0d0; --muted:#7a7490; --border:#252340;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--night);font-family:'DM Sans',sans-serif;color:var(--text);}
body{display:flex;flex-direction:column;overflow:hidden;}

/* HEADER */
#hdr{
  height:50px;flex-shrink:0;
  background:var(--night);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.hstar{font-size:20px;filter:drop-shadow(0 0 6px var(--gold));animation:glow 3s ease-in-out infinite;}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 5px var(--gold))}50%{filter:drop-shadow(0 0 16px var(--gold))}}
.htitle{flex:1;}
.htitle h1{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--gold);font-weight:900;line-height:1;}
.htitle p{font-size:0.62rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
#cnt{background:var(--gold);color:var(--night);font-weight:700;font-size:0.74rem;padding:3px 10px;border-radius:20px;white-space:nowrap;}
#wspBtn{
  display:flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,#ff6b35,#f7931e);
  color:#fff;font-weight:600;font-size:0.74rem;
  padding:5px 12px;border-radius:20px;text-decoration:none;
  white-space:nowrap;flex-shrink:0;
  box-shadow:0 2px 10px rgba(247,147,30,.35);
  transition:all .18s;
}
#wspBtn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(247,147,30,.5);opacity:.92;}

/* TOOLBAR */
#tbr{
  height:42px;flex-shrink:0;
  background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:7px;padding:0 12px;overflow-x:auto;
}
#tbr::-webkit-scrollbar{display:none;}
#si{
  flex-shrink:0;width:190px;
  background:var(--card);border:1px solid var(--border);
  color:var(--text);padding:5px 11px;border-radius:6px;
  font-family:'DM Sans',sans-serif;font-size:0.78rem;outline:none;transition:border-color .2s;
}
#si:focus{border-color:var(--gold);}
#si::placeholder{color:var(--muted);}
.sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}
.fb{
  flex-shrink:0;background:var(--card);border:1px solid var(--border);
  color:var(--muted);padding:4px 11px;border-radius:6px;
  font-size:0.7rem;cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .15s;white-space:nowrap;
}
.fb.on,.fb:hover{background:var(--gold);color:var(--night);border-color:var(--gold);font-weight:600;}
.fb.open-btn.on,.fb.open-btn:hover{background:#3cc878;color:#0a1a10;border-color:#3cc878;}
#clock{flex-shrink:0;font-size:0.7rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-variant-numeric:tabular-nums;letter-spacing:.04em;display:none;}
#clock.vis{display:block;}

/* MAP — fixed height, full width */
#mapwrap{
  width:100%;height:420px;flex-shrink:0;position:relative;
}
#map{width:100%;height:100%;}

/* LEGEND over map */
#lg{
  position:absolute;bottom:12px;left:10px;z-index:400;
  background:rgba(11,11,22,.88);border:1px solid var(--border);
  border-radius:9px;padding:8px 11px;font-size:0.67rem;
  backdrop-filter:blur(6px);pointer-events:none;
}
#lg h4{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;font-size:0.6rem;}
.li{display:flex;align-items:center;gap:5px;color:var(--text);margin-bottom:2px;}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* DETAIL PANEL — over map */
#dp{
  position:absolute;bottom:0;left:0;right:0;
  background:rgba(11,11,24,.97);border-top:1px solid var(--border);
  backdrop-filter:blur(10px);padding:14px 16px;
  transform:translateY(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  z-index:500;max-height:75%;overflow-y:auto;
}
#dp.open{transform:translateY(0);}
#dp::-webkit-scrollbar{width:3px;}
#dp::-webkit-scrollbar-thumb{background:var(--border);}
.dc{position:absolute;top:10px;right:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);width:25px;height:25px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;}
.dc:hover{color:var(--text);border-color:var(--gold);}
.dcat{font-size:0.64rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;margin-bottom:4px;}
.dname{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;line-height:1.3;padding-right:30px;margin-bottom:9px;}
.dmeta{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:9px;}
.mi{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:6px 9px;}
.ml{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1px;}
.mv{font-size:0.78rem;font-weight:600;}
.da{display:flex;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:7px 9px;margin-bottom:9px;font-size:0.78rem;}
.dd{font-size:0.78rem;color:#a09ab0;line-height:1.55;margin-bottom:9px;}
.dl{display:inline-block;background:var(--gold);color:var(--night);font-weight:700;padding:7px 18px;border-radius:7px;text-decoration:none;font-size:0.78rem;}
.dl:hover{opacity:.85;}

/* LIST */
#listwrap{
  flex:1;min-height:0;overflow-y:auto;
  background:var(--panel);border-top:1px solid var(--border);
}
#listwrap::-webkit-scrollbar{width:4px;}
#listwrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

#listhead{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--panel);z-index:10;
}
#listhead h2{font-family:'Playfair Display',serif;font-size:0.88rem;color:var(--gold);font-weight:700;}
#listhead p{font-size:0.67rem;color:var(--muted);}

/* Grid of cards */
#el{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:6px;
  padding:10px 12px;
}

.ec{
  background:var(--card);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;
  cursor:pointer;transition:all .15s;
  position:relative;overflow:hidden;
}
.ec::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--gold));border-radius:3px 0 0 3px;}
.ec:hover,.ec.on{border-color:var(--cc,var(--gold));background:#1e1e32;}
.et{font-size:0.66rem;font-weight:600;color:var(--cc,var(--gold));letter-spacing:.04em;margin-bottom:2px;}
.en{font-size:0.8rem;font-weight:500;line-height:1.3;color:var(--text);margin-bottom:3px;}
.ep{font-size:0.69rem;color:var(--muted);}
.ebs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;}
.bx{font-size:0.61rem;padding:1px 6px;border-radius:4px;border:1px solid;}
.bf{color:#3cc878;border-color:rgba(60,200,120,.3);background:rgba(60,200,120,.08);}
.br{color:var(--rose);border-color:rgba(224,90,110,.3);background:rgba(224,90,110,.08);}
.bk{color:var(--teal);border-color:rgba(58,204,200,.3);background:rgba(58,204,200,.08);}
.nores{text-align:center;padding:40px 16px;color:var(--muted);font-size:0.85rem;grid-column:1/-1;}

/* Leaflet overrides */
.leaflet-popup-content-wrapper{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:9px;font-family:'DM Sans',sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.6);}
.leaflet-popup-tip{background:var(--panel);}
.leaflet-popup-content{margin:9px 13px;font-size:0.78rem;}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--text)!important;border-color:var(--border)!important;}
.leaflet-control-zoom a:hover{background:var(--card)!important;}
</style>
</head>

let map,markers=[],activeCat='all',searchQ='',activeCard=null,filterOpen=false;

function mkIcon(cat,big){
  const c=CC[cat]||'#f0c040',s=big?18:13;
  return L.divIcon({className:'',html:`<div style="width:${s}px;height:${s}px;background:${c};border-radius:50%;border:2px solid rgba(0,0,0,.5);box-shadow:0 0 ${big?10:4}px ${c};"></div>`,iconSize:[s,s],iconAnchor:[s/2,s/2]});
}

function getFiltered(){
  return EV.filter(e=>{
    const mc=activeCat==='all'||e.c===activeCat;
    const q=searchQ.toLowerCase();
    const ms=!q||e.n.toLowerCase().includes(q)||e.p.toLowerCase().includes(q);
    const mo=!filterOpen||isOpen(e);
    return mc&&ms&&mo;
  });
}

function render(){
  const list=getFiltered();
  const openCount=EV.filter(isOpen).length;
  document.getElementById('cnt').textContent=list.length+' atrakcji';
  document.getElementById('sbc').textContent=
    filterOpen
      ? `${list.length} czynnych teraz · z ${openCount} otwartych`
      : `${list.length} wydarzeń · wg godziny`;
  renderMarkers(list);
  renderList(list);
}

function renderMarkers(list){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  list.forEach(ev=>{
    const m=L.marker([ev.lat,ev.lng],{icon:mkIcon(ev.c,false)})
      .addTo(map)
      .bindTooltip(ev.n,{direction:'top',offset:[0,-8],opacity:0.95})
      .on('click',()=>{showDetail(ev);map.panTo([ev.lat,ev.lng]);hlMarker(ev.id);hlCardById(ev.id);});
    m._eid=ev.id;
    markers.push(m);
  });
}

function renderList(list){
  const el=document.getElementById('el');
  const sorted=[...list].sort((a,b)=>a.t.localeCompare(b.t));
  if(!sorted.length){el.innerHTML='<div class="nores">Brak wyników dla wybranych filtrów.</div>';return;}
  el.innerHTML=sorted.map(ev=>`
    <div class="ec" data-id="${ev.id}" style="--cc:${CC[ev.c]}">
      <div class="et">${ev.t} · ${CL[ev.c]}</div>
      <div class="en">${ev.n}</div>
      <div class="ep">📍 ${ev.p}</div>
      <div class="ebs">
        <span class="bx bf">Wstęp wolny</span>
        ${ev.r?'<span class="bx br">⚠ Rezerwacja</span>':''}
        ${ev.k?'<span class="bx bk">👶 Dla dzieci</span>':''}
        ${isOpen(ev)?'<span class="bx" style="color:#3cc878;border-color:rgba(60,200,120,.4);background:rgba(60,200,120,.1);">🟢 Czynne</span>':''}
      </div>
    </div>`).join('');
  el.querySelectorAll('.ec').forEach(card=>{
    card.addEventListener('click',()=>{
      const ev=EV.find(e=>e.id===+card.dataset.id);
      if(!ev)return;
      showDetail(ev);
      map.flyTo([ev.lat,ev.lng],16,{duration:0.6});
      hlMarker(ev.id);
      hlCard(card);
    });
  });
}

function hlMarker(id){
  markers.forEach(m=>{const ev=EV.find(e=>e.id===m._eid);if(ev)m.setIcon(mkIcon(ev.c,m._eid===id));});
}
function hlCard(card){
  if(activeCard)activeCard.classList.remove('on');
  activeCard=card;card.classList.add('on');
  card.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function hlCardById(id){
  const c=document.querySelector(`.ec[data-id="${id}"]`);
  if(c)hlCard(c);
}
function toMin(s){const[h,m]=s.split(':').map(Number);return h*60+m;}

function isOpen(ev){
  const now=new Date();
  const cur=now.getHours()*60+now.getMinutes();
  const start=toMin(ev.t);
  let end=toMin(ev.e);
  // Handles "24:00" (=1440) and times past midnight like "03:00"
  if(end===0) end=1440; // "00:00" means midnight closing = end of day
  if(end<=start){
    // Crosses midnight: open if cur>=start OR cur<end
    return cur>=start||cur<end;
  }
  return cur>=start&&cur<end;
}

function showDetail(ev){
  const col=CC[ev.c];
  const gmUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.p+', Wrocław')}`;
  document.getElementById('dcontent').innerHTML=`
    <div class="dcat" style="color:${col}">${CL[ev.c]}</div>
    <div class="dname">${ev.n}</div>
    <div class="dmeta">
      <div class="mi"><div class="ml">Otwarcie</div><div class="mv">⏰ ${ev.t}</div></div>
      <div class="mi"><div class="ml">Zamknięcie</div><div class="mv">🌙 ${ev.e}</div></div>
      <div class="mi"><div class="ml">Wstęp</div><div class="mv" style="color:#3cc878">✓ Bezpłatny</div></div>
      <div class="mi"><div class="ml">Rezerwacja</div><div class="mv" style="color:${ev.r?'#e05a6e':'#3cc878'}">${ev.r?'⚠ Wymagana':'✓ Niewymagana'}</div></div>
    </div>
    <div class="da"><span>📍</span><span>${ev.p}</span></div>
    ${ev.d?`<p class="dd">${ev.d}</p>`:''}
    <a class="dl" href="${gmUrl}" target="_blank">🗺 Nawiguj w Google Maps</a>
    <a class="dl" style="margin-top:6px;background:var(--card);color:var(--text);border:1px solid var(--border);" href="${ev.url}" target="_blank">→ Więcej informacji</a>
  `;
  document.getElementById('dp').classList.add('open');
}

window.addEventListener('load',()=>{
  map=L.map('map',{center:[51.1090,17.0350],zoom:14});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap contributors',maxZoom:19
  }).addTo(map);
  setTimeout(()=>map.invalidateSize(),150);
  render();

  document.getElementById('dclose').addEventListener('click',()=>{
    document.getElementById('dp').classList.remove('open');
  });
  document.querySelectorAll('.fb[data-c]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.fb[data-c]').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      activeCat=btn.dataset.c;
      render();
    });
  });

  // Otwarte button — independent toggle
  const openBtn=document.getElementById('openBtn');
  const clockEl=document.getElementById('clock');

  function updateClock(){
    const n=new Date();
    const h=String(n.getHours()).padStart(2,'0');
    const m=String(n.getMinutes()).padStart(2,'0');
    clockEl.textContent='⏱ '+h+':'+m;
  }

  openBtn.addEventListener('click',()=>{
    filterOpen=!filterOpen;
    openBtn.classList.toggle('on',filterOpen);
    clockEl.classList.toggle('vis',filterOpen);
    if(filterOpen)updateClock();
    render();
  });

  setInterval(()=>{
    if(filterOpen){updateClock();render();}
  },30000);
  document.getElementById('si').addEventListener('input',e=>{
    searchQ=e.target.value;render();
  });
});
</script>
</body>
</html>
